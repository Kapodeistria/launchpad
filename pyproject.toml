[project]
name = "launchpad"
version = "0.1.0"
description = "Live Claude Code + Codex sessions on a Launchpad Mini MK3"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "iterm2>=2.22",
    "mido>=1.3.3",
    "python-rtmidi>=1.5.8",
]

[project.scripts]
launchpad = "launchpad.daemon:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
